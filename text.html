
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="./bootstrap.css">
		<script src="./bootstrap.bundle.min.js"></script>
		  <script src="./jquery.js"></script>
	</head>
	<style>
	        .del{
	            border: 2px solid rgb(220, 0, 0)!important;          /*定义边框 !important最高优先级*/
	            padding: 1px 20px 2px!important;           /*定义内边距 上，左右，下*/
	            border-radius: 1%;                     /*定义圆角边框*/
	            display: inline-block;                     /*定义行内块级*/
	            position: absolute;                       /*定义绝对定位*/
	            right: 2px;                             /*距离右侧2px*/
	            top: 2px;                              /*距离顶部2px*/
	            background:#f72929!important;           /*定义背景色*/
	        }
	        .redWars{
	            border: 1px solid rgba(255, 255, 255, 0)!important;          /*定义边框*/
	            padding: 15px 26px!important;            /*定义内边距*/
	            border-radius: 50%;                     /*定义圆角边框*/
	            font-size: 40px;                         /*定义字体大小*/
	            color: #F72943;                         /*定义字体颜色*/
	            background: yellow;                      /*定义背景色*/
	            display: inline-block;                     /*定义行内块级元素*/
	            position: absolute;                       /*定义绝对定位*/
	            left: 105px;                              /*距离左侧105px*/
	            top: 260px;                             /*距离顶部260px*/
	        }
	</style>
	</head>
	<body class="container">
	<div class="modal fade" id="myModal" >
	    <div class="modal-dialog modal-dialog-centered" role="document" style="width: 300px">
	        <div class="modal-content">
	            <button type="button" class="close del" data-bs-dismiss="modal">
	                <span >&times;</span>
	            </button>
	            <img src="6.png" alt="" class="img-fluid rounded">
	            <a href="好东西呀\text.html" class="btn redWars">抢</a>
	        </div>
	    </div>
	</div>
	<script>
	    $(function(){
	        $('#myModal').modal('show');
	    });
	</script>
	</body>
</html>
