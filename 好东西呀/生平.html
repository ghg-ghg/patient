<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
	<style>
       .image-container {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="services" class="services p-8 bg-gray-100">
        <div class="container mx-auto">
            <div class="service-info text-center mb-8">
                <h2 class="text-3xl font-bold">蠢猪的世界</h2>
                <p class="text-gray-600">探索精彩世界，服务由我们做起</p>
            </div>
            <div class="services-grids grid grid-cols-1 md:grid-cols-4 gap-8">
                <div class="service-grid bg-white p-6 rounded-lg shadow-md">
                    <div class="ser-info">
                        <h2 class="text-xl font-bold">饮食习惯</h2>
                    </div>
                    <div class="border-b-2 border-gray-300 my-2"></div>
                    <div class="ser-info">
                        <p class="text-gray-600">猪是一种杂食性动物，通常会吃各种植物（如草、果蔬）和动物性食物（如虫子、残余食品）。</p>
                    </div>
                    <div class="text-center mt-4">
                        <a href="#" class="read-more-link text-blue-500 hover:underline" data-target="img1">阅读更多</a>
                    </div>
                    <div id="img1" class="image-container">
                        <img src="饮食.png" alt="展示的图片" class="w-full h-auto">
                    </div>
                </div>
                <div class="service-grid bg-white p-6 rounded-lg shadow-md">
                    <div class="ser-info">
                        <h2 class="text-xl font-bold">社交互动</h2>
                    </div>
                    <div class="border-b-2 border-gray-300 my-2"></div>
                    <div class="ser-info">
                        <p class="text-gray-600">猪非常社交，喜欢和其他猪一起生活。它们会建立群体和社交层级。通过声音、姿态和肢体语言与其他猪进行交流。</p>
                    </div>
                    <div class="text-center mt-4">
                        <a href="#" class="read-more-link text-blue-500 hover:underline" data-target="img2">阅读更多</a>
                    </div>
                    <div id="img2" class="image-container">
                        <img src="社交.png" alt="展示的图片" class="w-full h-auto">
                    </div>
                </div>
                <div class="service-grid bg-white p-6 rounded-lg shadow-md">
                    <div class="ser-info">
                        <h2 class="text-xl font-bold">活动和玩耍</h2>
                    </div>
                    <div class="border-b-2 border-gray-300 my-2"></div>
                    <div class="ser-info">
                        <p class="text-gray-600">猪喜欢在户外活动，翻滚、跑步和玩耍。它们具有好奇心，喜欢探索周围的环境。</p>
                    </div>
                    <div class="text-center mt-4">
                        <a href="#" class="read-more-link text-blue-500 hover:underline" data-target="img3">阅读更多</a>
                    </div>
                    <div id="img3" class="image-container">
                        <img src="玩耍.png" alt="展示的图片" class="w-full h-auto">
                    </div>
                </div>
                <div class="service-grid bg-white p-6 rounded-lg shadow-md">
                    <div class="ser-info">
                        <h2 class="text-xl font-bold">睡眠和休息</h2>
                    </div>
                    <div class="border-b-2 border-gray-300 my-2"></div>
                    <div class="ser-info">
                        <p class="text-gray-600">猪通常会在温暖舒适的地方休息，可能会挖掘一块地方作为卧床。虽然猪是杂食动物，但它们的活动的高峰期一般是在早晨和傍晚。</p>
                    </div>
                    <div class="text-center mt-4">
                        <a href="#" class="read-more-link text-blue-500 hover:underline" data-target="img4">阅读更多</a>
                    </div>
                    <div id="img4" class="image-container">
                        <img src="睡觉.png" alt="展示的图片" class="w-full h-auto">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.read-more-link').click(function(event) {
                event.preventDefault();
                var target = $(this).data('target');
                $('#' + target).toggle();
            });
        });
    </script>
</body>
</html>
